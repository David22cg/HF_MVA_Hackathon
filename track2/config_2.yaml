# config_2.yaml  —  parameters for the repurposing model
paths:
  # Download once from
  # https://string-db.org/cgi/download  (9606.protein.links.v12.0.txt.gz + .info).
  string_links: "~/mva/data/9606.protein.links.v12.0.txt.gz"
  string_info:  "~/mva/data/9606.protein.info.v12.0.txt.gz"

  #gene modules (edit these to re-target the model to another disease) ---
  stress_module:     "./modules/stress_module.txt"          # aneuploidy-stress druggable module 
  kinetic_module:    "./modules/kinetic_module.txt"         # cell-cycle-slowing module 
  checkpoint_module: "./modules/checkpoint_module.txt"      # mitotic-fidelity module 
  dependencies:      "./modules/aneuploidy_dependencies.txt" # DepMap synthetic-lethal

  drug_targets:      "./data/drug_targets_real.tsv"      
  drug_signatures:   "./data/drug_signatures_real.tsv"   

  disease_signature: "./data/disease_signature.tsv"

  known_positives:   "./data/known_positives.txt"

  # from_track1.py reads Track 1's ranked candidates and writes seed_genes.txt
  # repurpose_adr.py merges those -> into the checkpoint/veto anchor
  track1_candidates: ""   
  seed_genes:        "./data/seed_genes.txt"           # generated by from_track1.py

  out: "./out"

string_min_score: 700     # STRING combined-score cut (high confidence), as in Track 1
n_random: 1000            # degree-matched random samples for the proximity z-score (Guney null)
significant_z: -1.64      # z <= this = "significantly proximal" (one-sided p<0.05)

allow_demo: false         #just a demo

checkpoint:
  from_seed: true         # derive the veto set dynamically from seed + STRING 
  radius: 1               # hops from the seed on the score>=string_min_score STRING graph
  replace_static: true   #demo-> false

#   score = stress*closeness_stress + dependency*dep + kinetic*kin + approved*approved_score
weights:
  stress: 1.0
  dependency: 1.5
  kinetic: 1.25
  approved: 1.0
  danger: 1.0


signature:
  min_overlap: 5          
  significant_conn: 0.20  


combine:
  w_network: 1.0
  w_signature: 1.0
