proband_id: ""  
hf_username: ""  # hugging face
approach_name: ""   # csv
add_chr_prefix: true       #  chr
subtype_hint: "none"       
                        
paths:
  vcf_raw:   ""
  work:      "~/mva/work"
  out:       ""
  annotated: "~/mva/work/annotated.tsv"
  hpo_terms: "./hpo_terms.txt"    
  panel:     "./genes/mva_g.txt"
  phenocopy: "./genes/phenocopy.txt" 
  acmg_sf:   "./genes/acmg_sf.txt"
  hpo_genes: "~/mva/data/genes_to_phenotype.txt"
  string_links: "~/mva/data/9606.protein.links.v12.0.txt.gz"
  string_info:  "~/mva/data/9606.protein.info.v12.0.txt.gz"
 
# intercation network
network:
  string_min_score: 700   # 700 high confidence
  max_neighbors: 10        #max interacting partners drawn per candidate-> tunable

#genomAD
freq:
  #max AF for RECESSIVE variants. In recessive disease there are healthy
  #        carriers, so some frequency is tolerated.
  # ->  "filtering allele frequency" framework from Whiffin et al.
  #        2017, Genet Med, doi:10.1038/gim.2017.26. MVA has prevalence
  #        <1/1,000,000, so the real credible AF is << 1%: 0.01 is a generous
  #        and safe ceiling.
  max_af_recessive: 0.01
  # max AF for DOMINANT / de novo: practically absent.
  # same Whiffin 2017 framework; matches the ACMG PM2 criterion (Richards et al. 2015, doi:10.1038/gim.2015.30).
  max_af_dominant: 0.0001
 
deleterious:
  #AlphaMissense threshold for missense (amino-acid change). 0-1. 
  #Cheng et al. 2023, Science, doi:10.1126/science.adg7492.
  #Classes: <0.34 likely benign / 0.34-0.564 ambiguous / >0.564 likely pathogenic. We use 0.564 = their "likely pathogenic" cut-off.
  alphamissense_min: 0.564
  #consequences VEP marks as IMPACT=HIGH (break the protein).
  #Ensembl VEP consequence scale, McLaren et al.
  #2016, Genome Biol, doi:10.1186/s13059-016-0974-4.
  high_impact: [frameshift_variant, stop_gained, stop_lost, start_lost, splice_acceptor_variant, splice_donor_variant, transcript_ablation]
  #SpliceAI threshold (delta score) to call a variant splice-altering.
  #Jaganathan et al. 2019, Cell, doi:10.1016/j.cell.2018.12.015
  #(0.5 = recommended cut-off; 0.2 = high sensitivity). 
  spliceai_min: 0.5
 
phenotype:
    #phenotype-prioritization concept (Kohler/Exomiser)
  points_per_match: 0.5
  max_points: 3

mosaic:
  #The exact limit varies by study.
  #0.35 = clearly below the het 0.5; 0.10 = reliable detection floor at typical WGS depth (~30x).
  vaf_min: 0.10
  vaf_max: 0.35

  #minimum depth to trust a low VAF.
  #GATK Best Practices; DP>=20 is a common floor for reliable germline calls.
  min_dp: 20
 
#tunable
epcr:
  top_clinvar_or_biallelic_lof: 0.95   # solid candidate
  strong_contender: 0.55               # 1-2 real alternatives
  weak_contender: 0.20                 # the rest, plausible
  secondary_floor: 0.10                # secondary/incidental findings
 